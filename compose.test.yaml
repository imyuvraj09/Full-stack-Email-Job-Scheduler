name: reachinbox-integration
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: integration-only
      POSTGRES_DB: reachinbox_integration
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U scheduler"]
      interval: 2s
      timeout: 2s
      retries: 30
  redis:
    image: redis:7.4
    tmpfs: [/data]
  search:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.4
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    tmpfs: [/usr/share/elasticsearch/data]
  integration:
    build: .
    command: ["npm","run","test:integration"]
    environment:
      PGHOST: db
      PGUSER: scheduler
      POSTGRES_PASSWORD: integration-only
      PGDATABASE: reachinbox_integration
      REDIS_HOST: redis
      ES_URL: http://search:9200
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
      search: {condition: service_started}
