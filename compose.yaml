x-app: &app
  build: .
  env_file: .env
  environment:
    PGHOST: db
    PGUSER: scheduler
    PGDATABASE: scheduler
    REDIS_HOST: redis
    ES_URL: http://search:9200
  depends_on:
    db: {condition: service_healthy}
    redis: {condition: service_healthy}
    search: {condition: service_started}
  restart: unless-stopped
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: scheduler
      POSTGRES_DB: scheduler
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U scheduler"]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4
    command: redis-server --appendonly yes --appendfsync always --maxmemory-policy noeviction
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 3s
      timeout: 3s
      retries: 30
  search:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.4
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - search:/usr/share/elasticsearch/data
  api:
    <<: *app
    ports: ["127.0.0.1:3000:3000"]
  worker:
    <<: *app
    command: ["npm","run","worker"]
volumes:
  db:
  redis:
  search:
