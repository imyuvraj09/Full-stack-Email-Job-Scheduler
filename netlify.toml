[build]
  command = "npm run build"
  publish = "frontend/dist"

[build.environment]
  VITE_API_URL = "https://full-stack-email-job-scheduler-qe6u.onrender.com"

[[redirects]]
  from = "/api/*"
  to = "https://full-stack-email-job-scheduler-qe6u.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/auth/*"
  to = "https://full-stack-email-job-scheduler-qe6u.onrender.com/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/ops/*"
  to = "https://full-stack-email-job-scheduler-qe6u.onrender.com/ops/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
